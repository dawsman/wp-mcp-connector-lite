name: Release

on:
  push:
    branches:
      - main
  # A manual run enters at the `test` job too — `release` needs it, so a
  # workflow_dispatch can never publish without a green test matrix.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # One file per invocation: php -l only reports on its first argument
      # under PHP 7.4, so a single multi-file call would silently skip the rest.
      - name: Lint PHP sources
        run: |
          for f in wp-mcp-connect.php uninstall.php includes/*.php; do
            php -l "$f"
          done

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wp_test root root 127.0.0.1 latest

      - name: PHPUnit
        run: vendor/bin/phpunit

      # Security sniffs only — formatting noise is deliberately out of scope.
      # A hit here fails the build; annotate provably safe code at the call
      # site with a scoped phpcs:disable/enable pair and a reason.
      - name: PHPCS security sniffs
        continue-on-error: false
        run: |
          vendor/bin/phpcs \
            --standard=WordPress \
            --extensions=php \
            --ignore=vendor,tests,node_modules \
            --sniffs=WordPress.DB.PreparedSQL,WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput \
            .

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: |
          FILE_VERSION=$(grep -E '^\s*\*\s*Version:' wp-mcp-connect.php | head -n1 | sed -E 's/.*Version:\s*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "File version: $FILE_VERSION"

          git fetch --tags

          if git rev-parse "v$FILE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$FILE_VERSION exists — auto-bumping patch"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$FILE_VERSION"
            HIGHEST=$(git tag -l "v${MAJOR}.${MINOR}.*" | sed 's/^v//' | sort -V | tail -n1)
            if [ -n "$HIGHEST" ]; then
              IFS='.' read -r _ _ HP <<< "$HIGHEST"
              PATCH=$((HP + 1))
            else
              PATCH=$((PATCH + 1))
            fi
            VERSION="${MAJOR}.${MINOR}.${PATCH}"

            sed -i -E "s/^(\s*\*\s*Version:\s*).*/\1${VERSION}/" wp-mcp-connect.php
            sed -i -E "s/(define\(\s*'WP_MCP_CONNECT_VERSION',\s*')[^']+('\s*\);)/\1${VERSION}\2/" wp-mcp-connect.php

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add wp-mcp-connect.php
            git commit -m "chore: bump version to ${VERSION} [skip ci]"
            git push origin main
          else
            VERSION="$FILE_VERSION"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Sync the manifest's version/download_url/last_updated before the build.
      # build.sh requires plugin-header version and manifest version to match;
      # this step makes that invariant hold after an auto-bump. The manifest is
      # only edited here — it is not committed until the release asset exists.
      - name: Update manifest (version, download_url, last_updated)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/wp-mcp-connect-${VERSION}.zip"
          jq --arg v "$VERSION" --arg d "$DOWNLOAD_URL" --arg date "$DATE" \
            '.version = $v | .download_url = $d | .last_updated = $date' \
            update-info.json > update-info.tmp && mv update-info.tmp update-info.json

      # Delegate to build.sh so CI and local builds produce byte-identical ZIPs.
      # build.sh also computes and injects zip_sha256 — required by the updater.
      - name: Build plugin ZIP (via build.sh)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Tag release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: wp-mcp-connect-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true

      # Last, on purpose. update-info.json is served raw from main and is what
      # installed sites poll for updates, so it must not advertise a
      # download_url until the tag and its ZIP asset actually exist —
      # otherwise every site that polls in the gap gets a 404.
      - name: Commit manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update-info.json
          if ! git diff --cached --quiet; then
            git commit -m "Update manifest for v${VERSION} [skip ci]"
            git push origin main
          fi
